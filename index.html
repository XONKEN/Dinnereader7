function dateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function active(i){return settings.notificationsOn&&(settings.weekendOn||i<5)&&!!settings.days[i]?.enabled}
function nextReminder(){const now=new Date();for(let n=0;n<8;n++){const d=new Date(now);d.setDate(now.getDate()+n);const i=dayIndex(d);if(!active(i))continue;const [h,m]=(settings.days[i].time||settings.defaultTime).split(':').map(Number);d.setHours(h||0,m||0,0,0);if(d>now)return{i,time:settings.days[i].time,at:d}}return null}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const el=document.getElementById('toast');if(!el)return;el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200)}
function nav(){return `<nav class="bottom"><button class="nav ${page==='home'?'active':''}" data-page="home"><span class="ico">🏠</span>首頁</button><button class="nav ${page==='days'?'active':''}" data-page="days"><span class="ico">📅</span>每日設定</button><button class="nav ${page==='history'?'active':''}" data-page="history"><span class="ico">📝</span>紀錄</button><button class="nav ${page==='group'?'active':''}" data-page="group"><span class="ico">👨‍👩‍👧</span>群組</button><button class="nav ${page==='settings'?'active':''}" data-page="settings"><span class="ico">⚙️</span>設定</button></nav>`}
function header(label,title,sub){return `<header class="top"><div class="eyebrow">${label}</div><h1 class="title">${title}</h1><div class="subtitle">${sub}</div><div class="versionmark">v9</div></header>`}
function home(){const n=nextReminder(),count=settings.days.filter((_,i)=>active(i)).length;let rows=DAYS.map((d,i)=>`<div class="dayrow"><div class="daynum">${SHORT[i]}</div><div class="dayinfo"><div class="dayname">${d}</div><div class="daytime">${active(i)?settings.days[i].time:'提醒關閉'}</div></div><button class="switch ${active(i)?'on':''}" data-toggle="${i}" aria-label="${d}提醒"></button></div>`).join('');return `${header('DINING REMINDER','今晚回家吃飯嗎？','本週提醒總覽')}<section class="section"><div class="hero"><div class="small">● 下一次提醒</div><div class="day">${n?DAYS[n.i]:'尚未設定'}</div><div class="time">${n?n.time:'--:--'}</div><div class="body">${esc(settings.body)}</div><div class="bell">🔔</div></div></section><section class="section"><div class="section-head"><h2>本週提醒</h2><span class="count">${count} 天已開啟</span></div>${rows}</section><div class="madeby">MADE BY <span>永程</span></div>${nav()}`}
function days(){return `${header('SCHEDULE','每日設定','逐日調整提醒時間與開關')}<section class="section"><div class="card">${DAYS.map((d,i)=>`<div class="settingline"><div class="settingtext"><div class="settingtitle">${d}</div><div class="settingdesc">${active(i)?'已開啟提醒':'未開啟提醒'}</div></div><input class="timeinput" type="time" value="${esc(settings.days[i].time)}" data-time="${i}" ${settings.days[i].enabled?'':'disabled'}><button class="switch ${settings.days[i].enabled?'on':''}" data-toggle="${i}" aria-label="${d}提醒"></button></div>`).join('')}</div><div class="card"><div class="settingline"><div class="settingtext"><div class="settingtitle">週末提醒</div><div class="settingdesc">關閉後星期六、日不會提醒</div></div><button class="switch ${settings.weekendOn?'on':''}" data-weekend></button></div></div></section>${nav()}`}
function settingsPage(){const firebaseReady=!!fb.db&&!!fb.user;return `${header('SETTINGS','設定','通知與 App 行為')}<section class="section"><div class="card"><div class="settingline"><div class="settingtext"><div class="settingtitle">提醒通知</div><div class="settingdesc">開啟後依每日設定提醒</div></div><button class="switch ${settings.notificationsOn?'on':''}" data-notify></button></div></div><div class="card"><div class="settingtitle">通知文字</div><label class="notice">標題<input class="input" data-title value="${esc(settings.title)}"></label><label class="notice">內容<input class="input" data-body value="${esc(settings.body)}"></label></div><div class="card"><div class="settingtitle">通知上的快速答覆</div><p class="notice">兩個按鈕的文字可以自己改。它們仍代表「回家」與「不回家」兩種結果。</p><label class="notice">選項一<input class="input" data-reply-home value="${esc(settings.replyHomeLabel)}" maxlength="24" placeholder="例如：我會回家"></label><label class="notice">選項二<input class="input" data-reply-away value="${esc(settings.replyAwayLabel)}" maxlength="24" placeholder="例如：今天不吃"></label><div class="choice"><button class="homebtn" data-preview-home>${esc(settings.replyHomeLabel)}</button><button class="awaybtn" data-preview-away>${esc(settings.replyAwayLabel)}</button></div></div><div class="card"><button class="btn primary" data-permission>允許手機通知</button><button class="btn secondary" data-test>立即測試通知</button><p class="notice">V9 會優先使用 Service Worker + FCM；若裝置不支援背景推播，仍會使用網頁監聽作為備援。</p></div><div class="card"><div class="settingtitle">家庭群組雲端</div><div class="${firebaseReady?'firebase-state':'firebase-state bad'}">${firebaseReady?'● Firebase 已連線':'○ 尚未連線 Firebase'}</div><p class="notice">只要貼上 Firebase Web App 的完整 SDK 設定即可，不需要單獨輸入 API Key。</p><button class="btn secondary" data-firebase>${firebaseReady?'重新設定 Firebase':'貼上 Firebase 設定'}</button><label class="notice" style="display:block;margin-top:10px">FCM Web Push 公開金鑰<input class="input" data-vapid value="${esc(localStorage.getItem('dinner-reminder-vapid-v1')||'')}" placeholder="Firebase Cloud Messaging 的 Web Push certificate key"></label><p class="notice">若要在 App 完全關閉時仍可靠推播，需要啟用 FCM 並部署 V9 附帶的 Firebase Functions。公開 VAPID 金鑰可放在這裡。</p><button class="btn primary" data-page="group">前往群組</button></div></section>${nav()}`}
function targetDateTimeValue(){const d=new Date(Date.now()+3600000),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function groupPage(){
  if(!fb.db||!fb.user)return `${header('FAMILY GROUP','家庭群組','把家人的晚餐回覆集中在一起')}<section class="section"><div class="card groupCard"><div class="groupTitle"><div class="groupIcon">☁️</div><div><div class="settingtitle">先連接 Firebase</div><div class="notice">連線後才能建立或加入家庭群組。</div></div></div><button class="btn primary" data-firebase style="margin-top:14px">設定 Firebase</button></div></section>${nav()}`;

  const gname=localStorage.getItem('dinner-group-name-v2')||'家庭群組';
  return `${header('FAMILY GROUP',esc(gname),'群組控制台 · 即時同步')}<section class="section"><div class="hero groupHero"><div class="groupbadge">● LIVE · 家庭群組</div><div class="day">${esc(gname)}</div><div class="body">${groupMembers.length} 位成員正在這個群組</div><div class="groupCode"><strong>${esc(fb.groupId)}</strong><button class="copymini" data-copy-code>複製</button></div><div class="groupStats"><div class="stat"><b>${groupMembers.length}</b><span>目前成員</span></div><div class="stat"><b>${Math.min(groupMessages.length,50)}</b><span>最近回覆</span></div></div></div></section><section class="section"><div class="card groupCard"><div class="section-head"><div class="groupTitle"><div class="groupIcon">👥</div><div><div class="settingtitle">成員</div><div class="notice">誰已經加入群組</div></div></div><span class="pill">即時</span></div><div id="members">${membersHtml()}</div></div><div class="card groupCard"><div class="section-head"><div class="groupTitle"><div class="groupIcon">🔔</div><div><div class="settingtitle">通知中心</div><div class="notice">所有人的晚餐答覆</div></div></div><span class="count">最近 ${Math.min(groupMessages.length,50)} 則</span></div><div id="messages">${messagesHtml()}</div></div><div class="card groupCard blurIn"><div class="section-label">SEND TO FAMILY</div><div class="groupTitle" style="margin-top:6px"><div class="groupIcon">🔔</div><div><div class="settingtitle">替家人新增通知</div><div class="notice">群組內每個人都可以指定其他成員，在指定時間收到自訂通知。</div></div></div><div class="groupNoticeForm" style="margin-top:12px"><label class="fieldLabel">通知給誰</label><select class="select" data-target-member>${groupMembers.filter(m=>m.uid!==fb.user?.uid).map(m=>`<option value="${esc(m.uid)}">${esc(m.name||'成員')}</option>`).join('')}</select><label class="fieldLabel">日期與時間</label><input class="dateinput" type="datetime-local" data-target-at value="${targetDateTimeValue()}"><label class="fieldLabel">標題</label><input class="input" data-target-title value="提醒一下 🔔" maxlength="60"><label class="fieldLabel">內容</label><textarea class="input textarea" data-target-body maxlength="180" placeholder="例如：你洗衣服了嗎？">你洗衣服了嗎？</textarea><div class="schedulePreview"><span class="scheduleDot"></span><span>通知會顯示「是」與「否」兩個快速回覆按鈕</span></div><button class="btn primary" data-create-notice>建立給家人的通知</button></div></div><div class="card groupCard"><div class="section-label">GROUP SETTINGS</div><div class="settingtitle" style="margin-top:6px">你的暱稱</div><input class="input" data-nickname value="${esc(getName())}" maxlength="20"><p class="notice">修改後會同步更新到所有成員的畫面。</p><div class="rowbuttons" style="margin-top:8px"><button class="btn secondary smallbtn" data-copy-code>分享群組代碼</button><button class="btn danger smallbtn" data-leave-group>離開群組</button></div></div></section>${nav()}`;
}

function getName(){return localStorage.getItem(USERKEY)||'成員'}
function groupJoinCreate(){return `<div class="card groupCard"><div class="section-label">YOUR PROFILE</div><div class="groupTitle" style="margin-top:6px"><div class="groupIcon">👤</div><div><div class="settingtitle">你的名稱</div><div class="notice">家人會用這個名字看到你的回覆。</div></div></div><input class="input" data-nickname placeholder="例如：爸爸、媽媽、永程" maxlength="20" value="${esc(getName())}"></div><div class="card groupCard"><div class="section-label">CREATE GROUP</div><div class="groupTitle" style="margin-top:6px"><div class="groupIcon">✨</div><div><div class="settingtitle">建立新群組</div><div class="notice">建立後會得到 8 碼代碼，直接分享給家人。</div></div></div><input class="input" data-groupname placeholder="例如：永程家" maxlength="30"><button class="btn primary" data-create-group style="margin-top:10px">建立我的群組</button></div><div class="card groupCard"><div class="section-label">JOIN GROUP</div><div class="groupTitle" style="margin-top:6px"><div class="groupIcon">🔗</div><div><div class="settingtitle">加入現有群組</div><div class="notice">輸入家人給你的 8 碼群組代碼。</div></div></div><input class="input" data-joincode placeholder="例如：AB7K2M9Q" maxlength="8" autocapitalize="characters" style="text-transform:uppercase"><button class="btn secondary" data-join-group style="margin-top:10px">加入家人群組</button></div>`}
function membersHtml(){return groupMembers.length?groupMembers.map(m=>`<div class="member"><div class="avatar">${(m.name||'成員').slice(0,1)}</div><div class="settingtext"><div class="settingtitle">${esc(m.name||'成員')}${m.uid===fb.user?.uid?'（你）':''}</div><div class="settingdesc">● 已加入群組</div></div></div>`).join(''):'<div class="noticeEmpty">還沒有成員資料</div>'}
function messageChoice(x){return esc(x.label||(x.choice==='home'?settings.replyHomeLabel:settings.replyAwayLabel))}
function messagesHtml(){return groupMessages.length?groupMessages.map(x=>{const when=x.createdAt?.toDate?x.createdAt.toDate():new Date(x.createdAt||Date.now());return `<div class="msg"><div class="msghead"><span class="msgname"><span class="msgDot"></span>${esc(x.name||'成員')}${x.uid===fb.user?.uid?'（你）':''}</span><span class="msgtime">${when.toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div><div class="msgbody">${x.choice==='home'?'🏠':'🚫'} ${messageChoice(x)}</div></div>`}).join(''):'<div class="noticeEmpty">目前還沒有晚餐答覆<br>家人回覆後會即時出現在這裡</div>'}
function render(){document.getElementById('app').innerHTML=page==='home'?home():page==='days'?days():page==='history'?history():page==='group'?groupPage():settingsPage();if(page==='group'&&fb.db&&fb.groupId)renderGroupParts()}
function renderGroupParts(){const m=document.getElementById('members'),x=document.getElementById('messages');if(m)m.innerHTML=membersHtml();if(x)x.innerHTML=messagesHtml()}
function history(){const sorted=[...logs].sort((a,b)=>b.at.localeCompare(a.at));const content=sorted.length?sorted.map(l=>`<div class="card log"><div class="logdate"><div class="settingtitle">${formatDate(l.date)}</div><div class="muted">${esc(l.time)}</div></div><span class="badge ${l.choice==='home'?'home':'away'}">${esc(l.label||(l.choice==='home'?settings.replyHomeLabel:settings.replyAwayLabel))}</span></div>`).join(''):`<div class="card empty">還沒有任何紀錄</div>`;return `${header('HISTORY','紀錄','依日期查看過去的選擇')}<section class="section">${content}${sorted.length?'<button class="btn danger" data-clear>清除全部紀錄</button>':''}</section>${nav()}`}
function formatDate(k){const [y,m,d]=k.split('-').map(Number),dt=new Date(y,m-1,d);return `${m}月${d}日（${SHORT[dayIndex(dt)]}）`}
async function askPermission(){if(!('Notification'in window)){permission='unsupported';toast('此瀏覽器不支援網頁通知');render();return}try{permission=await Notification.requestPermission();toast(permission==='granted'?'通知已允許':'通知未允許');if(permission==='granted')registerFcm().catch(()=>{});render()}catch{toast('無法取得通知權限')}}
async function notify(text=settings.body,title=settings.title,meta={}){if(!('Notification'in window)||Notification.permission!=='granted')return false;try{if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.ready;const options={body:text,tag:meta.tag||'dinner-reminder',icon:'./icon-192.png?v=9.0.1',badge:'./icon-192.png?v=9.0.1',renotify:true,requireInteraction:true,data:{time:meta.time||'',kind:meta.kind||'dinner'}};if(meta.actions!==false)options.actions=[{action:'home',title:meta.actionHome||settings.replyHomeLabel},{action:'away',title:meta.actionAway||settings.replyAwayLabel}];await reg.showNotification(title,options);return true}new Notification(title,{body:text});return true}catch(e){console.error(e);try{new Notification(title,{body:text});return true}catch{return false}}}
function addLog(choice,time=new Date().toTimeString().slice(0,5)){const d=dateKey(),label=choice==='home'?settings.replyHomeLabel:settings.replyAwayLabel;logs=[{id:d+'-'+Date.now(),date:d,time,choice,label,at:new Date().toISOString()},...logs.filter(x=>x.date!==d)];save();toast('已記錄：'+label);if(fb.db&&fb.groupId)publishReply(choice,time,label);render()}
function showChoiceBox(reminderTime){if(choiceBoxShown)return;choiceBoxShown=true;const sec=document.querySelector('.section');if(!sec)return;const box=document.createElement('div');box.className='card';box.innerHTML=`<div class="settingtitle">${esc(settings.body)}</div><div class="notice">提醒時間 ${esc(reminderTime)}</div><div class="choice"><button class="homebtn" data-choice="home">${esc(settings.replyHomeLabel)}</button><button class="awaybtn" data-choice="away">${esc(settings.replyAwayLabel)}</button></div>`;sec.prepend(box);box.addEventListener('click',e=>{const c=e.target.closest('[data-choice]');if(c){addLog(c.dataset.choice,reminderTime);box.remove();choiceBoxShown=false}})}
function currentReminder(){const now=new Date(),i=dayIndex(now);if(!active(i))return null;const time=settings.days[i].time||settings.defaultTime;const [h,m]=time.split(':').map(Number);const target=new Date(now);target.setHours(h||0,m||0,0,0);const diff=now.getTime()-target.getTime();if(diff>=0&&diff<90000)return{time,at:target,i};return null}
async function checkReminder(){const r=currentReminder();if(!r)return;const key=dateKey(r.at)+'-'+r.i+'-'+r.time;if(firedKey===key)return;firedKey=key;await notify(settings.body,settings.title,{time:r.time,kind:'dinner',tag:'dinner-'+dateKey(r.at)});showChoiceBox(r.time)}
function firebaseConfig(){try{return JSON.parse(localStorage.getItem(FIREKEY)||'null')}catch{return null}}
function normalizeFirebaseConfig(raw){let text=String(raw||'').trim();if(!text)return null;const first=text.indexOf('{'),last=text.lastIndexOf('}');if(first>=0&&last>first)text=text.slice(first,last+1);try{const cfg=JSON.parse(text);if(!cfg.apiKey||!cfg.authDomain||!cfg.projectId||!cfg.appId)throw new Error('missing');return cfg}catch{}const pick=k=>{const re=new RegExp('(?:"'+k+'"|'+k+')\\s*:\\s*["\\\']([^"\\\']+)["\\\']');const m=text.match(re);return m?m[1]:''};const cfg={apiKey:pick('apiKey'),authDomain:pick('authDomain'),projectId:pick('projectId'),storageBucket:pick('storageBucket'),messagingSenderId:pick('messagingSenderId'),appId:pick('appId')};return cfg.apiKey&&cfg.authDomain&&cfg.projectId&&cfg.appId?cfg:null}
async function stopGroupSync(){if(fb.unsubMembers){fb.unsubMembers();fb.unsubMembers=null}if(fb.unsubMessages){fb.unsubMessages();fb.unsubMessages=null}if(fb.unsubScheduled){fb.unsubScheduled();fb.unsubScheduled=null}groupMembers=[];groupMessages=[];groupReady=false;groupInitialSnapshot=true;knownMessageIds=new Set()}
async function initFirebase(){const cfg=firebaseConfig();if(!cfg||!window.firebase)return false;try{await stopGroupSync();if(fb.app){const o=fb.app.options||{};if(o.projectId!==cfg.projectId||o.appId!==cfg.appId||o.apiKey!==cfg.apiKey){await fb.app.delete();fb.app=null}}if(!fb.app){const same=firebase.apps.find(a=>{const o=a.options||{};return o.projectId===cfg.projectId&&o.appId===cfg.appId&&o.apiKey===cfg.apiKey});fb.app=same||firebase.initializeApp(cfg)}fb.auth=fb.app.auth();fb.db=fb.app.firestore();if(!fb.auth.currentUser){const r=await fb.auth.signInAnonymously();fb.user=r.user}else fb.user=fb.auth.currentUser;if(fb.groupId)startGroupSync();return !!fb.user}catch(e){console.error('Firebase init failed',e);fb.db=null;fb.user=null;toast('Firebase 連線失敗：'+firebaseError(e));return false}}
function firebaseError(e){const code=e?.code||'';const msg=String(e?.message||'');if(code.includes('auth/operation-not-allowed'))return'請到 Authentication → Sign-in method → Anonymous 啟用匿名登入';if(code.includes('permission-denied')||code.includes('PERMISSION_DENIED'))return'Firestore Rules 拒絕這個操作：請重新貼上本版規則並 Publish';if(code.includes('failed-precondition'))return'Firestore 尚未建立完成，或需要建立索引';if(code==='group-not-found'||msg==='GROUP_NOT_FOUND')return'找不到這個 8 碼群組';if(code==='group-code-collision')return'群組代碼產生失敗，請再試一次';return code||msg||'請檢查 Firebase 設定'}
async function askFirebase(){const old=firebaseConfig();const raw=prompt('請貼上 Firebase「Web App SDK 設定」整段內容。\n\n可貼 const firebaseConfig = { ... } 或直接貼 { ... }。\n不要只貼 API Key。',old?JSON.stringify(old,null,2):'');if(raw===null)return;const cfg=normalizeFirebaseConfig(raw);if(!cfg){toast('讀不到 Firebase 設定：請完整複製 Web App SDK 設定');return}localStorage.setItem(FIREKEY,JSON.stringify(cfg));if(fb.app){try{await stopGroupSync();await fb.app.delete()}catch(e){console.warn('Firebase app reset',e)}fb.app=null}fb.auth=null;fb.db=null;fb.user=null;const ok=await initFirebase();render();toast(ok?'✓ Firebase 雲端連線成功':'連線失敗：請檢查匿名登入與 Firestore Rules')}
function randomCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=chars[Math.floor(Math.random()*chars.length)];return s}
async function createGroup(){const btn=document.querySelector('[data-create-group]');if(btn){btn.disabled=true;btn.textContent='建立中…'}if(!fb.db||!fb.user){toast('Firebase 尚未完成連線，請先確認匿名登入已啟用');if(btn){btn.disabled=false;btn.textContent='建立我的群組'}return}const name=(document.querySelector('[data-groupname]')?.value||'永程家').trim()||'永程家';const nickname=(document.querySelector('[data-nickname]')?.value||'成員').trim()||'成員';localStorage.setItem(USERKEY,nickname);try{let code='';for(let i=0;i<8;i++){const candidate=randomCode(),ref=fb.db.collection('groups').doc(candidate);try{await fb.db.runTransaction(async tx=>{const snap=await tx.get(ref);if(snap.exists)throw new Error('GROUP_EXISTS');tx.set(ref,{name,createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:fb.user.uid})});code=candidate;break}catch(e){if(e.message==='GROUP_EXISTS')continue;throw e}}if(!code)throw Object.assign(new Error('無法產生可用群組代碼'),{code:'group-code-collision'});await fb.db.collection('groups').doc(code).collection('members').doc(fb.user.uid).set({uid:fb.user.uid,name:nickname,joinedAt:firebase.firestore.FieldValue.serverTimestamp()});fb.groupId=code;localStorage.setItem(GROUPKEY,code);localStorage.setItem('dinner-group-name-v2',name);page='group';render();startGroupSync();toast('群組建立成功：'+code)}catch(e){console.error('createGroup',e);toast('建立失敗：'+firebaseError(e))}finally{if(btn){btn.disabled=false;btn.textContent='建立我的群組'}}}
async function joinGroup(){const btn=document.querySelector('[data-join-group]');if(btn){btn.disabled=true;btn.textContent='加入中…'}if(!fb.db||!fb.user){toast('Firebase 尚未完成連線，請先確認匿名登入已啟用');if(btn){btn.disabled=false;btn.textContent='加入家人群組'}return}const code=(document.querySelector('[data-joincode]')?.value||'').trim().toUpperCase();const nickname=(document.querySelector('[data-nickname]')?.value||'成員').trim()||'成員';if(!/^[A-Z0-9]{8}$/.test(code)){toast('請輸入 8 碼群組代碼');if(btn){btn.disabled=false;btn.textContent='加入家人群組'}return}localStorage.setItem(USERKEY,nickname);try{const ref=fb.db.collection('groups').doc(code),snap=await ref.get();if(!snap.exists)throw Object.assign(new Error('GROUP_NOT_FOUND'),{code:'group-not-found'});await ref.collection('members').doc(fb.user.uid).set({uid:fb.user.uid,name:nickname,joinedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});fb.groupId=code;localStorage.setItem(GROUPKEY,code);localStorage.setItem('dinner-group-name-v2',snap.data()?.name||'家庭群組');page='group';render();startGroupSync();toast('已加入 '+(snap.data()?.name||'家庭群組'))}catch(e){console.error('joinGroup',e);toast('加入失敗：'+firebaseError(e))}finally{if(btn){btn.disabled=false;btn.textContent='加入家人群組'}}}
async function publishReply(choice,time,label){if(!fb.db||!fb.groupId||!fb.user)return;try{await fb.db.collection('groups').doc(fb.groupId).collection('messages').add({uid:fb.user.uid,name:getName(),choice,label,time,createdAt:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){console.error('publishReply',e);toast('群組同步失敗：'+firebaseError(e))}}
async function createGroupNotice(){const btn=document.querySelector('[data-create-notice]');if(!fb.db||!fb.groupId||!fb.user){toast('請先連接並加入家庭群組');return}const targetUid=document.querySelector('[data-target-member]')?.value||'';const target=groupMembers.find(m=>m.uid===targetUid);const atRaw=document.querySelector('[data-target-at]')?.value||'';const title=(document.querySelector('[data-target-title]')?.value||'提醒一下 🔔').trim();const body=(document.querySelector('[data-target-body]')?.value||'').trim();if(!target){toast('請先加入至少一位其他成員');return}if(!atRaw||!title||!body){toast('請完整填寫通知內容');return}const at=new Date(atRaw);if(Number.isNaN(at.getTime())||at.getTime()<=Date.now()){toast('請選擇未來的日期與時間');return}if(btn){btn.disabled=true;btn.textContent='建立中…'}try{const ref=fb.db.collection('groups').doc(fb.groupId).collection('scheduledNotifications').doc();await ref.set({targetUid,targetName:target.name||'成員',senderUid:fb.user.uid,senderName:getName(),title,body,scheduledAt:firebase.firestore.Timestamp.fromDate(at),status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});toast(`已建立給 ${target.name||'成員'} 的通知`);render();startGroupSync()}catch(e){console.error('createGroupNotice',e);toast('建立通知失敗：'+firebaseError(e))}finally{if(btn){btn.disabled=false;btn.textContent='建立給家人的通知'}}}
async function registerFcm(){if(!fb.app||!fb.user||!fb.db||!fb.groupId||!('serviceWorker'in navigator)||!window.firebase?.messaging)return false;const vapid=localStorage.getItem('dinner-reminder-vapid-v1')||'';if(!vapid)return false;try{const reg=await navigator.serviceWorker.ready;const messaging=firebase.messaging(fb.app);const token=await messaging.getToken({vapidKey:vapid,serviceWorkerRegistration:reg});if(!token)return false;const tokenId=btoa(token).replace(/[^a-zA-Z0-9_-]/g,'').slice(0,100)||'token';await fb.db.collection('groups').doc(fb.groupId).collection('members').doc(fb.user.uid).collection('devices').doc(tokenId).set({token,uid:fb.user.uid,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});if(!window.__fcmBound){window.__fcmBound=true;messaging.onMessage(payload=>{const n=payload.notification||{},d=payload.data||{};if(d.notificationId)localStorage.setItem('family-fired-'+d.notificationId,'1');notify(n.body||d.body||'家庭通知',n.title||d.title||'家庭通知',{actions:true,time:d.time||'',kind:'family',tag:d.notificationId||('family-'+Date.now()),actionHome:'是',actionAway:'否'}).catch(()=>{})})}return true}catch(e){console.warn('FCM registration failed',e);return false}}
async function startGroupSync(){
  if(!fb.db||!fb.user||!fb.groupId)return;
  await stopGroupSync();
  const groupId=fb.groupId, gref=fb.db.collection('groups').doc(groupId);
  fb.unsubMembers=gref.collection('members').onSnapshot(s=>{
    groupMembers=s.docs.map(d=>({uid:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    groupReady=true; renderGroupParts();
  },e=>{console.error(e);toast('讀取群組成員失敗：'+firebaseError(e))});
  knownMessageIds=new Set(); groupInitialSnapshot=true;
  fb.unsubMessages=gref.collection('messages').limit(50).onSnapshot(s=>{
    const docs=s.docs.map(d=>({id:d.id,...d.data()}));
    docs.sort((a,b)=>{const at=a.createdAt?.toMillis?a.createdAt.toMillis():0,bt=b.createdAt?.toMillis?b.createdAt.toMillis():0;return bt-at});
    const seenKey='dinner-seen-messages-'+groupId; let saved=[]; try{saved=JSON.parse(localStorage.getItem(seenKey)||'[]')}catch{}
    const savedSet=new Set(saved);
    if(groupInitialSnapshot){docs.forEach(d=>{knownMessageIds.add(d.id);savedSet.add(d.id)});groupInitialSnapshot=false}
    else{for(const d of docs){if(!knownMessageIds.has(d.id)&&!savedSet.has(d.id)){knownMessageIds.add(d.id);savedSet.add(d.id);if(d.uid!==fb.user.uid){const label=d.label||(d.choice==='home'?settings.replyHomeLabel:settings.replyAwayLabel);notify((d.name||'群組成員')+' 的回覆',label,{kind:'group',tag:'group-'+d.id,actions:false}).catch(()=>{})}}}}
    localStorage.setItem(seenKey,JSON.stringify([...savedSet].slice(-100))); groupMessages=docs; renderGroupParts();
  },e=>{console.error(e);toast('讀取群組通知紀錄失敗：'+firebaseError(e))});
  fb.unsubScheduled=gref.collection('scheduledNotifications').where('targetUid','==',fb.user.uid).where('status','==','pending').onSnapshot(s=>{
    const now=Date.now();
    s.docs.forEach(d=>{
      const x=d.data(),at=x.scheduledAt?.toDate?x.scheduledAt.toDate():new Date(x.scheduledAt||0),delay=at.getTime()-now;
      const firedKey='family-fired-'+d.id;
      if(localStorage.getItem(firedKey))return;
      if(delay>0&&delay<2147483647){
        const key='family-timer-'+d.id;
        if(!window[key]){window[key]=true;setTimeout(()=>{delete window[key];if(!localStorage.getItem(firedKey)&&Date.now()-at.getTime()<90000){localStorage.setItem(firedKey,'1');notify(x.body||'',x.title||'家庭通知',{time:at.toTimeString().slice(0,5),kind:'family',tag:'family-'+d.id,actions:true,actionHome:'是',actionAway:'否'}).catch(()=>{})}},delay)}
      }else if(delay<=0&&delay>-90000){localStorage.setItem(firedKey,'1');notify(x.body||'',x.title||'家庭通知',{time:at.toTimeString().slice(0,5),kind:'family',tag:'family-'+d.id,actions:true,actionHome:'是',actionAway:'否'}).catch(()=>{})}
    });
  },e=>{console.error('scheduled listener',e);toast('讀取家人排程失敗：'+firebaseError(e))});
  registerFcm().catch(()=>{});
}
async function leaveGroup(){if(!fb.groupId)return;try{if(fb.db&&fb.user)await fb.db.collection('groups').doc(fb.groupId).collection('members').doc(fb.user.uid).delete()}catch(e){console.error(e)}await stopGroupSync();fb.groupId='';localStorage.removeItem(GROUPKEY);localStorage.removeItem('dinner-group-name-v2');page='group';toast('已離開群組');render()}
function updateName(value){const name=value.trim()||'成員';localStorage.setItem(USERKEY,name);if(fb.db&&fb.groupId&&fb.user)fb.db.collection('groups').doc(fb.groupId).collection('members').doc(fb.user.uid).set({name},{merge:true}).catch(e=>console.error('updateName',e))}
function handle(e){const t=e.target.closest('button');if(!t)return;if(t.dataset.choice){return}if(t.dataset.page){page=t.dataset.page;render();return}if(t.dataset.toggle!==undefined){const i=+t.dataset.toggle;settings.days[i].enabled=!settings.days[i].enabled;save();render();return}if(t.dataset.weekend!==undefined){settings.weekendOn=!settings.weekendOn;save();render();return}if(t.dataset.notify!==undefined){settings.notificationsOn=!settings.notificationsOn;save();render();return}if(t.dataset.permission!==undefined){askPermission();return}if(t.dataset.test!==undefined){notify('這是一則測試通知','今晚回家吃飯嗎？',{time:new Date().toTimeString().slice(0,5)});return}if(t.dataset.clear!==undefined){if(confirm('確定要清除全部紀錄嗎？')){logs=[];save();render()}return}if(t.dataset.firebase!==undefined){askFirebase();return}if(t.dataset.createGroup!==undefined){createGroup();return}if(t.dataset.createNotice!==undefined){createGroupNotice();return}if(t.dataset.joinGroup!==undefined){joinGroup();return}if(t.dataset.copyCode!==undefined){navigator.clipboard?.writeText(fb.groupId).then(()=>toast('群組代碼已複製')).catch(()=>toast('群組代碼：'+fb.groupId));return}if(t.dataset.leaveGroup!==undefined){if(confirm('確定要離開目前群組嗎？'))leaveGroup();return}if(t.dataset.previewHome!==undefined||t.dataset.previewAway!==undefined)return}
document.addEventListener('click',handle);
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.time!==undefined){settings.days[+t.dataset.time].time=t.value||'19:00';save();render()}if(t.dataset.title!==undefined){settings.title=t.value;save()}if(t.dataset.body!==undefined){settings.body=t.value;save()}if(t.dataset.replyHome!==undefined){settings.replyHomeLabel=t.value.trim()||defaults.replyHomeLabel;save();render()}if(t.dataset.replyAway!==undefined){settings.replyAwayLabel=t.value.trim()||defaults.replyAwayLabel;save();render()}if(t.dataset.vapid!==undefined){localStorage.setItem('dinner-reminder-vapid-v1',t.value.trim())}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.nickname!==undefined)updateName(t.value);if(t.dataset.title!==undefined){settings.title=t.value;save()}if(t.dataset.body!==undefined){settings.body=t.value;save()}if(t.dataset.replyHome!==undefined){settings.replyHomeLabel=t.value||defaults.replyHomeLabel;save()}if(t.dataset.replyAway!==undefined){settings.replyAwayLabel=t.value||defaults.replyAwayLabel;save()}if(t.dataset.vapid!==undefined){localStorage.setItem('dinner-reminder-vapid-v1',t.value.trim())}});
async function handleQuickReply(choice,time){const key='dinner-quick-reply-'+dateKey()+'-'+choice+'-'+(time||'');if(localStorage.getItem(key))return;localStorage.setItem(key,'1');addLog(choice,time||new Date().toTimeString().slice(0,5));if(location.search)history.replaceState({},'',location.pathname+location.hash)}
async function handlePendingReply(){const params=new URLSearchParams(location.search),choice=params.get('reply');if(choice!=='home'&&choice!=='away')return;await handleQuickReply(choice,params.get('time')||'')}
if('serviceWorker'in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='quick-reply')handleQuickReply(e.data.choice,e.data.time||'')});
async function start(){render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw-v9.js?v=9.0.1').catch(e=>console.error('SW',e));if(firebaseConfig())await initFirebase();if('Notification'in window&&Notification.permission==='granted')registerFcm().catch(()=>{});render();await handlePendingReply();checkReminder();setInterval(checkReminder,5000)}
start();
})();</script></body></html>
